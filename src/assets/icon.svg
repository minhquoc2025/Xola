<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <linearGradient id="bladeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#cdd6e0"/>
    </linearGradient>
    <linearGradient id="bladeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0beca"/>
      <stop offset="100%" stop-color="#7f91a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c47a00"/>
    </linearGradient>
    <linearGradient id="gripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d47a57"/>
      <stop offset="100%" stop-color="#9e4d31"/>
    </linearGradient>

    <g id="sword">
      <!-- Outer dark outline -->
      <path d="M 64 4 L 74 16 L 74 84 L 84 84 C 87.5 84 89.5 86.2 89.5 89 C 89.5 91.8 87.5 94 84 94 L 72 94 L 72 109 C 73.8 110 75 111.8 75 114.5 C 75 119.5 70.5 123 64 123 C 57.5 123 53 119.5 53 114.5 C 53 111.8 54.2 110 56 109 L 56 94 L 44 94 C 40.5 94 38.5 91.8 38.5 89 C 38.5 86.2 40.5 84 44 84 L 54 84 L 54 16 Z"
            fill="#1b1e24" stroke="#1b1e24" stroke-width="3.2" stroke-linejoin="round"/>

      <!-- Blade Left Half (Light Silver) -->
      <polygon points="64,7 56,17 56,85 64,85" fill="url(#bladeLight)"/>
      <!-- Blade Right Half (Steel Silver) -->
      <polygon points="64,7 72,17 72,85 64,85" fill="url(#bladeDark)"/>
      <!-- Blade Center Ridge & Edge Highlights -->
      <line x1="64" y1="8" x2="64" y2="85" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.75"/>
      <polyline points="57,84 57,17.5 64,8.5" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-opacity="0.85"/>

      <!-- Grip (Brown Handle) -->
      <rect x="58" y="92" width="12" height="18" rx="2" fill="url(#gripGrad)"/>
      <line x1="60.5" y1="93" x2="60.5" y2="109" stroke="#e49574" stroke-width="1.8" stroke-opacity="0.65"/>

      <!-- Crossguard (Gold) -->
      <path d="M 43 85 L 85 85 C 87.2 85 88.5 86.8 88.5 89 C 88.5 91.2 87.2 93 85 93 L 43 93 C 40.8 93 39.5 91.2 39.5 89 C 39.5 86.8 40.8 85 43 85 Z"
            fill="url(#goldGrad)" stroke="#7a4a00" stroke-width="0.9"/>
      <circle cx="43" cy="89" r="3.8" fill="url(#goldGrad)"/>
      <circle cx="85" cy="89" r="3.8" fill="url(#goldGrad)"/>
      <polygon points="64,82.5 69,89 64,94.5 59,89" fill="url(#goldGrad)"/>
      <line x1="42" y1="87" x2="86" y2="87" stroke="#fff3b0" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75"/>

      <!-- Pommel Gold Ring -->
      <rect x="55" y="107" width="18" height="5.5" rx="2.7" fill="url(#goldGrad)" stroke="#7a4a00" stroke-width="0.8"/>
      <!-- Pommel Dark Brown Cap -->
      <ellipse cx="64" cy="116" rx="8.5" ry="5.8" fill="#7d321b"/>
      <ellipse cx="62" cy="114.5" rx="4.5" ry="2.5" fill="#a84b2d"/>
    </g>
  </defs>

  <!-- Back Sword: pointing top-left (-45 deg around blade center 64,56) -->
  <use href="#sword" transform="translate(0, 6) rotate(-45 64 56)"/>
  <!-- Front Sword: pointing top-right (+45 deg around blade center 64,56) -->
  <use href="#sword" transform="translate(0, 6) rotate(45 64 56)"/>
</svg>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Discord NPC Auto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font: 13px/1.4 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px; background: #16213e;
      border-bottom: 1px solid #0f3460;
      height: 40px; flex-shrink: 0;
    }
    #bar h1 { font-size: 14px; color: #e94560; white-space: nowrap; }



    #content {
      flex: 1; position: relative; background: #0a0a1a;
    }
    #content webview { width: 100%; height: 100%; border: none; }
    #content webview.wv-hidden { display: none; }

    #control-panel {
      height: 180px; flex-shrink: 0;
      background: #0d1b2e; border-top: 1px solid #1a3a5e;
      display: flex; gap: 12px; padding: 10px;
    }

    .panel-section {
      display: flex; flex-direction: column;
    }
    .panel-section h3 {
      font-size: 11px; color: #556688; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 8px;
    }

    #config-section {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 8px; align-content: start;
    }
    .config-field label {
      display: block; font-size: 10px; color: #888; margin-bottom: 3px;
    }
    .config-field input {
      width: 100%; padding: 6px 8px;
      background: #0a0a1a; border: 1px solid #1a1a4e; border-radius: 4px;
      color: #eee; font-size: 12px; outline: none;
    }
    .config-field input:focus { border-color: #e94560; }

    #action-section {
      flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    #action-section button {
      padding: 8px 20px; border: none; border-radius: 4px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-start { background: #1a5a2e; color: #fff; }
    .btn-start:hover { background: #2a7a3e; }
    .btn-stop { background: #5a1a1a; color: #fff; }
    .btn-stop:hover { background: #7a2a2a; }
    .btn-secondary { background: #2a2a4a; color: #aaa; }
    .btn-secondary:hover { background: #3a3a5a; }

    #status-section {
      flex-shrink: 0; width: 180px;
    }
    .status-row {
      display: flex; justify-content: space-between;
      font-size: 11px; margin-bottom: 4px;
    }
    .status-label { color: #888; }
    .status-value { color: #4ecca3; font-weight: 600; }

    #log-section {
      flex: 2; display: flex; flex-direction: column;
    }
    #log-area {
      flex: 1; background: #0a0a1a; border: 1px solid #1a1a3e;
      border-radius: 4px; padding: 6px; font: 11px/1.4 monospace;
      color: #aaa; overflow-y: auto; white-space: pre-wrap;
    }
    #log-area .log-entry { margin-bottom: 1px; }
    #log-controls {
      display: flex; gap: 4px; margin-top: 4px;
    }
    #log-controls button {
      background: #2a2a4a; color: #aaa; border: 1px solid #3a3a5a;
      padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 10px;
    }
    #log-controls button:hover { background: #3a3a5a; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>Discord NPC Auto</h1>
  </div>

  <div id="content"></div>
  <div id="control-panel">
    <div id="config-section" class="panel-section">
      <h3>Config</h3>
      <div class="config-field">
        <label for="npc-number">NPC Number</label>
        <input id="npc-number" type="number" value="1" min="1" max="99">
      </div>
      <div class="config-field">
        <label for="username">Username</label>
        <input id="username" type="text" value="Quất" placeholder="Tên Discord">
      </div>
      <div class="config-field">
        <label for="total-battles">Total Battles</label>
        <input id="total-battles" type="number" value="5" min="1" max="999">
      </div>
      <div class="config-field">
        <label for="cooldown-seconds">Cooldown (sec)</label>
        <input id="cooldown-seconds" type="number" value="120" min="10" max="600">
      </div>
      <div class="config-field">
        <label for="button-delay">Button Delay (sec)</label>
        <input id="button-delay" type="number" value="5" min="0.5" max="10" step="0.5">
      </div>
      <div class="config-field" style="border-left:1px solid #1a2a4e;padding-left:10px;">
        <label style="color:#4ecca3;font-weight:600;">🧠 SMART MODE</label>
        <span style="font-size:11px;color:#4ecca3;margin-top:6px;">ON - Đọc turn real-time</span>
        <span style="font-size:9px;color:#666;margin-top:2px;">Ưu tiên: 💚HP<60% → ☠️ → 🗡️ → ⚔️</span>
      </div>
      <div class="config-field" style="border-left:1px solid #1a2a4e;padding-left:10px;">
        <label style="color:#e94560;font-weight:600;">🚀 AUTO CLIMB</label>
        <label style="display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer;">
          <input id="auto-climb" type="checkbox" style="width:14px;height:14px;">
          <span style="font-size:11px;color:#ccc;">Bật Auto Climb</span>
        </label>
      </div>
      <div class="config-field">
        <label for="target-max-npc">Target NPC (đích)</label>
        <input id="target-max-npc" type="number" value="60" min="1" max="999">
      </div>
    </div>

    <div id="action-section" class="panel-section">
      <h3>Actions</h3>
      <button id="btn-toggle" class="btn-start" onclick="toggleBot()">▶ START</button>
      <button class="btn-secondary" onclick="clearLogs()">Clear Logs</button>
    </div>

    <div id="status-section" class="panel-section">
      <h3>Status</h3>
      <div class="status-row">
        <span class="status-label">Connection:</span>
        <span id="status-text" class="status-value">Not connected</span>
      </div>
      <div class="status-row">
        <span class="status-label">Mode:</span>
        <span id="current-tab" class="status-value">Single Account</span>
      </div>
    </div>

    <div id="log-section" class="panel-section">
      <h3>Logs</h3>
      <div id="log-area"></div>
      <div id="log-controls">
        <button onclick="loadLogs()">Refresh</button>
        <button onclick="clearLogs()">Clear</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

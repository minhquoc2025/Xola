<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Discord NPC Auto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font: 13px/1.4 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px; background: #16213e;
      border-bottom: 1px solid #0f3460;
      height: 40px; flex-shrink: 0;
    }
    #bar h1 { font-size: 14px; color: #e94560; white-space: nowrap; }



    #content {
      flex: 1; position: relative; background: #0a0a1a;
    }
    #content webview { width: 100%; height: 100%; border: none; }
    #content webview.wv-hidden { display: none; }

    #control-panel {
      height: 180px; flex-shrink: 0;
      background: #0d1b2e; border-top: 1px solid #1a3a5e;
      display: flex; gap: 8px; padding: 8px;
    }

    .panel-section {
      display: flex; flex-direction: column;
    }
    .panel-section h3 {
      font-size: 11px; color: #556688; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 6px;
    }

    .mode-panel {
      flex: 1;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 8px;
      display: flex; flex-direction: column;
    }
    .mode-panel h3 { margin-bottom: 4px; }

    .panel-divider {
      width: 1px;
      background: #1a2a4e;
      flex-shrink: 0;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      flex: 1;
      align-content: start;
    }
    .config-field label {
      display: block; font-size: 9px; color: #888; margin-bottom: 2px;
    }
    .config-field input {
      width: 100%; padding: 4px 6px;
      background: #0a0a1a; border: 1px solid #1a1a4e; border-radius: 3px;
      color: #eee; font-size: 11px; outline: none;
    }
    .config-field input:focus { border-color: #e94560; }
    .btn-start { background: #1a5a2e; color: #fff; }
    .btn-start:hover { background: #2a7a3e; }
    .btn-stop { background: #5a1a1a; color: #fff; }
    .btn-stop:hover { background: #7a2a2a; }
    .btn-secondary { background: #2a2a4a; color: #aaa; }
    .btn-secondary:hover { background: #3a3a5a; }

    #status-section {
      flex-shrink: 0; width: 180px;
    }
    .status-row {
      display: flex; justify-content: space-between;
      font-size: 11px; margin-bottom: 4px;
    }
    .status-label { color: #888; }
    .status-value { color: #4ecca3; font-weight: 600; }

    #log-section {
      flex: 0.5; display: flex; flex-direction: column;
      min-width: 160px;
    }
    #log-area {
      flex: 1; background: #0a0a1a; border: 1px solid #1a1a3e;
      border-radius: 4px; padding: 6px; font: 11px/1.4 monospace;
      color: #aaa; overflow-y: auto; white-space: pre-wrap;
    }
    #log-area .log-entry { margin-bottom: 1px; }
    #log-controls {
      display: flex; gap: 4px; margin-top: 4px;
    }
    #log-controls button {
      background: #2a2a4a; color: #aaa; border: 1px solid #3a3a5a;
      padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 10px;
    }
    #log-controls button:hover { background: #3a3a5a; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>Discord NPC Auto</h1>
  </div>

  <div id="content"></div>
  <div id="control-panel">
    <div id="npc-panel" class="panel-section mode-panel">
      <h3>⚔️ Auto Farm NPC</h3>
      <div class="config-grid">
        <div class="config-field">
          <label for="npc-number">NPC Number</label>
          <input id="npc-number" type="number" value="1" min="1" max="99">
        </div>
        <div class="config-field">
          <label for="username">Username</label>
          <input id="username" type="text" value="Quất" placeholder="Tên Discord">
        </div>
        <div class="config-field">
          <label for="total-battles">Total Battles</label>
          <input id="total-battles" type="number" value="5" min="1" max="999">
        </div>
        <div class="config-field">
          <label for="cooldown-seconds">Cooldown (sec)</label>
          <input id="cooldown-seconds" type="number" value="120" min="10" max="600">
        </div>
        <div class="config-field">
          <label for="button-delay">Delay (sec)</label>
          <input id="button-delay" type="number" value="5" min="0.5" max="10" step="0.5">
        </div>
        <div class="config-field">
          <label for="click-pattern">Click Pattern</label>
          <input id="click-pattern" type="text" value="3,2,1" placeholder="3,2,1">
        </div>
        <div class="config-field">
          <label style="color:#e94560;font-weight:600;font-size:9px;">AUTO CLIMB</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input id="auto-climb" type="checkbox" style="width:13px;height:13px;">
            <span style="font-size:10px;color:#ccc;">Bật</span>
          </label>
        </div>
        <div class="config-field">
          <label for="target-max-npc">Target NPC</label>
          <input id="target-max-npc" type="number" value="60" min="1" max="999">
        </div>
      </div>
      <button id="btn-npc-toggle" class="btn-start" onclick="toggleNpc()">▶ START</button>
    </div>

    <div class="panel-divider"></div>

    <div id="luanhoi-panel" class="panel-section mode-panel">
      <h3>🔄 Luân Hồi</h3>
      <div class="config-grid">
        <div class="config-field">
          <label for="username-lh">Username</label>
          <input id="username-lh" type="text" value="Quất" placeholder="Tên Discord">
        </div>
        <div class="config-field">
          <label for="cooldown-seconds-lh">Cooldown (sec)</label>
          <input id="cooldown-seconds-lh" type="number" value="120" min="10" max="600">
        </div>
        <div class="config-field">
          <label for="button-delay-lh">Delay (sec)</label>
          <input id="button-delay-lh" type="number" value="5" min="0.5" max="10" step="0.5">
        </div>
        <div class="config-field">
          <label for="max-layer">Max Layer (Boss)</label>
          <input id="max-layer" type="number" value="20" min="10" max="100" step="10">
        </div>
      </div>
      <button id="btn-luanhoi-toggle" class="btn-start" onclick="toggleLuanhoi()">▶ START</button>
    </div>

    <div id="log-section" class="panel-section">
      <h3>Logs</h3>
      <div id="log-area"></div>
      <div id="log-controls">
        <button onclick="loadLogs()">Refresh</button>
        <button onclick="clearLogs()">Clear</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

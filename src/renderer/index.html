<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Discord NPC Auto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 13px/1.4 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      height: 40px;
      flex-shrink: 0;
    }

    #bar h1 {
      font-size: 14px;
      color: #e94560;
      white-space: nowrap;
    }

    #btn-mute {
      margin-left: auto;
      background: #2a2a4a;
      color: #eee;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    #btn-mute:hover {
      background: #3a3a5a;
    }

    #btn-mute.muted {
      background: #5a1a1a;
      border-color: #7a2a2a;
    }

    #content {
      flex: 1;
      position: relative;
      background: #0a0a1a;
    }

    #content webview {
      width: 100%;
      height: 100%;
      border: none;
    }

    #content webview.wv-hidden {
      display: none;
    }

    #control-panel {
      height: 240px;
      flex-shrink: 0;
      background: #0d1b2e;
      border-top: 1px solid #1a3a5e;
      display: flex;
      gap: 6px;
      padding: 6px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
    }

    .panel-section h3 {
      font-size: 11px;
      color: #556688;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* === NPC Panel (25%) === */
    #npc-panel {
      flex: 0.25;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      flex: 1;
      align-content: start;
    }

    .config-field label {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 1px;
    }

    .config-field input {
      width: 100%;
      padding: 3px 5px;
      background: #0a0a1a;
      border: 1px solid #1a1a4e;
      border-radius: 3px;
      color: #eee;
      font-size: 11px;
      outline: none;
    }

    .config-field input:focus {
      border-color: #e94560;
    }

    .btn-start {
      background: #1a5a2e;
      color: #fff;
      margin-top: 4px;
    }

    .btn-start:hover {
      background: #2a7a3e;
    }

    .btn-stop {
      background: #5a1a1a;
      color: #fff;
      margin-top: 4px;
    }

    .btn-stop:hover {
      background: #7a2a2a;
    }

    .btn-secondary {
      background: #2a2a4a;
      color: #aaa;
    }

    .btn-secondary:hover {
      background: #3a3a5a;
    }

    /* === Stats Panel (50%) === */
    #stats-panel {
      flex: 0.5;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .stats-top {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }

    .stat-box {
      background: #0a1628;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-box-icon {
      font-size: 10px;
    }

    .stat-box-label {
      font-size: 9px;
      color: #888;
    }

    .stat-box-value {
      font-size: 14px;
      font-weight: 700;
      color: #4ecca3;
    }

    .stat-box-value.target {
      color: #ccc;
    }

    .stat-box-value.win {
      color: #5ae05a;
    }

    .stat-box-value.loss {
      color: #e94560;
    }

    .stat-box-value.coin {
      color: #ffd700;
    }

    .stat-box-value.exp {
      color: #87ceeb;
    }

    .stat-box-value.item {
      color: #c084fc;
    }

    .stats-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .stats-section {
      background: #0a1628;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .stats-section h4 {
      font-size: 10px;
      color: #556688;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid #1a2a4e;
    }

    .stats-section-body {
      flex: 1;
      overflow-y: auto;
      font-size: 11px;
    }

    .last-battle-result {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .last-battle-result.win {
      color: #5ae05a;
    }

    .last-battle-result.loss {
      color: #e94560;
    }

    .last-battle-npc {
      color: #aaa;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .last-battle-rewards {
      color: #4ecca3;
      font-size: 11px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
      border-bottom: 1px solid #0f1a2e;
      font-size: 10px;
    }

    .item-name {
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-count {
      color: #c084fc;
      font-weight: 600;
      margin-left: 4px;
      white-space: nowrap;
    }

    /* === Log Panel (25%) === */
    #log-section {
      flex: 0.25;
      display: flex;
      flex-direction: column;
    }

    #log-area {
      flex: 1;
      background: #0a0a1a;
      border: 1px solid #1a1a3e;
      border-radius: 4px;
      padding: 6px;
      font: 10px/1.4 monospace;
      color: #aaa;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    #log-area .log-entry {
      margin-bottom: 1px;
    }

    #log-controls {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    #log-controls button {
      background: #2a2a4a;
      color: #aaa;
      border: 1px solid #3a3a5a;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
    }

    #log-controls button:hover {
      background: #3a3a5a;
    }
  </style>
</head>

<body>
  <div id="bar">
    <h1>Discord NPC Auto</h1>
    <button id="btn-mute"
            title="Bật/Tắt tiếng toàn bộ âm thanh"
            onclick="toggleMute()">🔊</button>
  </div>

  <div id="content"></div>
  <div id="control-panel">
    <!-- NPC Panel (25%) -->
    <div id="npc-panel"
         class="panel-section">
      <h3>⚔️ Auto Farm NPC</h3>
      <div class="config-grid">
        <div class="config-field">
          <label for="npc-number">NPC Number</label>
          <input id="npc-number"
                 type="number"
                 value="1"
                 min="1"
                 max="99">
        </div>
        <div class="config-field">
          <label for="username">Username</label>
          <input id="username"
                 type="text"
                 value="Quất"
                 placeholder="Tên Discord">
        </div>
        <div class="config-field">
          <label for="total-battles">Total Battles</label>
          <input id="total-battles"
                 type="number"
                 value="5"
                 min="1"
                 max="999">
        </div>
        <div class="config-field">
          <label for="cooldown-seconds">Cooldown (sec)</label>
          <input id="cooldown-seconds"
                 type="number"
                 value="110"
                 min="10"
                 max="600">
        </div>
        <div class="config-field">
          <label for="button-delay">Delay (sec)</label>
          <input id="button-delay"
                 type="number"
                 value="3"
                 min="0.5"
                 max="10"
                 step="0.5">
        </div>
        <div class="config-field">
          <label for="click-pattern">Click Pattern</label>
          <input id="click-pattern"
                 type="text"
                 value="3,2,1"
                 placeholder="3,2,1">
        </div>
        <div class="config-field">
          <label style="color:#e94560;font-weight:600;font-size:9px;">AUTO CLIMB</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input id="auto-climb"
                   type="checkbox"
                   style="width:13px;height:13px;">
            <span style="font-size:10px;color:#ccc;">Bật</span>
          </label>
        </div>
        <div class="config-field">
          <label for="target-max-npc">Target NPC</label>
          <input id="target-max-npc"
                 type="number"
                 value="60"
                 min="1"
                 max="999">
        </div>
      </div>
      <button id="btn-npc-toggle"
              class="btn-start"
              onclick="toggleNpc()">▶ START</button>
    </div>

    <!-- Stats Panel (50%) -->
    <div id="stats-panel"
         class="panel-section">
      <h3>📊 Thống Kê Trận Đấu</h3>
      <div class="stats-top">
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">🎯</span> Target</p>
          <span class="stat-box-value target"
                id="stat-total">0 trận</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">🏆</span> Chiến Thắng</p>
          <span class="stat-box-value win"
                id="stat-wins">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">✕</span> Thất Bại</p>
          <span class="stat-box-value loss"
                id="stat-losses">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">💰</span> Coins</p>
          <span class="stat-box-value coin"
                id="stat-coins">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">✨</span> XP</p>
          <span class="stat-box-value exp"
                id="stat-exp">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">💎</span> Vật Phẩm</p>
          <span class="stat-box-value item"
                id="stat-items-count">0</span>
        </div>
      </div>
      <div class="stats-bottom">
        <div class="stats-section">
          <h4>Trận Gần Nhất</h4>
          <div class="stats-section-body"
               id="last-battle-info">
            <div style="color:#666;font-size:10px;">Chưa có trận nào...</div>
          </div>
        </div>
        <div class="stats-section">
          <h4>Vật Phẩm Rơi</h4>
          <div class="stats-section-body"
               id="items-list">
            <div style="color:#666;font-size:10px;">Chưa có vật phẩm...</div>
          </div>
          <button id="btn-reset-stats"
                  class="btn-secondary"
                  onclick="resetStats()"
                  style="margin-top:4px;width:100%;font-size:9px;padding:2px;">Reset Stats</button>
        </div>
      </div>
    </div>

    <!-- Log Panel (25%) -->
    <div id="log-section"
         class="panel-section">
      <h3>Logs</h3>
      <div id="log-area"></div>
      <div id="log-controls">
        <button onclick="loadLogs()">Refresh</button>
        <button onclick="clearLogs()">Clear</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>

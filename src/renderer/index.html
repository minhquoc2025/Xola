<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Discord NPC Auto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 13px/1.4 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      height: 40px;
      flex-shrink: 0;
    }

    #bar h1 {
      font-size: 14px;
      color: #e94560;
      white-space: nowrap;
    }

    #btn-mute {
      margin-left: auto;
      background: #2a2a4a;
      color: #eee;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    #btn-mute:hover {
      background: #3a3a5a;
    }

    #btn-mute.muted {
      background: #5a1a1a;
      border-color: #7a2a2a;
    }

    #content {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #0a0a1a;
    }

    #content webview {
      width: 100%;
      height: 100%;
      border: none;
    }

    #content webview.wv-hidden {
      display: none;
    }

    /* Panel dưới co giãn theo cửa sổ, không cố định 240px nữa:
       màn nhỏ (14"/15.6"/16" scale 125-150%) thì panel cao tối đa
       44% chiều cao cửa sổ và tự cuộn, không cắt nội dung. */
    #control-panel {
      flex: 0 0 auto;
      min-height: 260px;
      max-height: 44vh;
      overflow-y: auto;
      flex-shrink: 0;
      background: #0d1b2e;
      border-top: 1px solid #1a3a5e;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
    }

    .panel-section h3 {
      font-size: 11px;
      color: #556688;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* === NPC Panel === */
    #npc-panel {
      flex: 1 1 280px;
      min-width: 260px;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }

    /* === Tabs cho panel điều khiển ===
       Gốc lỗi khuất mode: 7 nút 1 hàng, mỗi nút white-space:nowrap
       nên tổng bề rộng tối thiểu ~400px, trong khi panel chỉ ~280px
       ở cửa sổ 1200px (còn hẹp hơn khi màn 16" scale 125-150%).
       Cho tabs xuống 2 hàng (4 nút/hàng), nút ⚙️ giữ 1 ô nhỏ ở
       hàng 2, chữ dài quá thì cắt "..." chứ không đẩy nút khác ra ngoài. */
    #mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    #mode-tabs button {
      flex: 1 1 calc(25% - 4px);
      min-width: 0;
      padding: 5px 4px;
      background: #0a1628;
      color: #aaa;
      border: 1px solid #1a2a4e;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #btn-config-modal {
      flex: 0 0 40px !important;
    }

    #mode-tabs button.active {
      background: #16213e;
      color: #e94560;
      border-color: #e94560;
    }

    .mode-config {
      display: none;
    }

    .mode-config.active {
      display: flex;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      flex: 1;
      align-content: start;
    }

    .config-field.full {
      grid-column: 1 / -1;
    }

    .config-field label {
      display: block;
      font-size: 9px;
      color: #888;
      margin-bottom: 1px;
    }

    .config-field input {
      width: 100%;
      padding: 3px 5px;
      background: #0a0a1a;
      border: 1px solid #1a1a4e;
      border-radius: 3px;
      color: #eee;
      font-size: 11px;
      outline: none;
    }

    .config-field input:focus {
      border-color: #e94560;
    }

    .btn-start {
      background: #1a5a2e;
      color: #fff;
      margin-top: 4px;
    }

    .btn-start:hover {
      background: #2a7a3e;
    }

    .btn-stop {
      background: #5a1a1a;
      color: #fff;
      margin-top: 4px;
    }

    .btn-stop:hover {
      background: #7a2a2a;
    }

    .btn-secondary {
      background: #2a2a4a;
      color: #aaa;
    }

    .btn-secondary:hover {
      background: #3a3a5a;
    }

    /* === Skill Modal === */
    .skill-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      margin: 2px 0;
      background: #0a1628;
      border: 1px solid #1a2a4e;
      border-radius: 4px;
      font-size: 11px;
      color: #ccc;
      cursor: default;
    }

    .skill-item .stt {
      background: #e94560;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .skill-item .skill-name {
      flex: 1;
    }

    .skill-item .skill-cat {
      font-size: 9px;
      color: #556688;
      background: #1a2a4e;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* === Stats Panel === */
    /* V56 (anh 2026-11-10): v55 chưa đủ — đo thực tế (7 món -> 30 món):
       #items-list cao 133 -> 570px mà KHÔNG cuộn trong (scrollHeight =
       clientHeight), #stats-panel phình 290 -> 727px, #control-panel chạm
       trần 44vh rồi cuộn CẢ panel (controlScrollH 740px), màn Discord bị
       ép từ 654 -> 519px. Gốc lỗi: min-height: 0 của v55 chỉ có tác dụng
       khi chuỗi flex có chiều cao xác định để co lại, mà #stats-panel cao
       theo nội dung (flex line lấy theo item cao nhất) nên không có điểm
       neo nào cả. Thêm max-height: 300px làm điểm neo — bằng chiều cao tự
       nhiên của #npc-panel (~290px) nên panel không bao giờ cao hơn hàng
       của nó; khi nội dung dài hơn, panel dừng ở 300px và chuỗi min-height: 0
       bên dưới mới có cái để co lại, 2 body cuộn trong. */
    #stats-panel {
      flex: 2 1 420px;
      min-width: 320px;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      min-height: 0;
      max-height: 300px;
    }

    .stats-top {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }

    .stat-box {
      background: #0a1628;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-box-icon {
      font-size: 10px;
    }

    .stat-box-label {
      font-size: 9px;
      color: #888;
    }

    .stat-box-value {
      font-size: 14px;
      font-weight: 700;
      color: #4ecca3;
    }

    .stat-box-value.target {
      color: #ccc;
    }

    .stat-box-value.win {
      color: #5ae05a;
    }

    .stat-box-value.loss {
      color: #e94560;
    }

    .stat-box-value.coin {
      color: #ffd700;
    }

    .stat-box-value.exp {
      color: #87ceeb;
    }

    .stat-box-value.item {
      color: #c084fc;
    }

    /* V56: hàng grid lấy theo chiều cao của khung (1fr) chứ không theo nội
       dung — không có dòng này thì hàng auto sẽ phình theo danh sách món
       dài nhất, 2 section không co lại được và body không cuộn trong. */
    .stats-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .stats-section {
      background: #0a1628;
      border: 1px solid #1a2a4e;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .stats-section h4 {
      font-size: 10px;
      color: #556688;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid #1a2a4e;
    }

    /* V55 (anh 2026-11-10): vật phẩm rơi nhiều thì #items-list phải cuộn
       bên trong, không đẩy panel lên. Cùng gốc lỗi v37: .stats-section-body
       là flex item (của .stats-section, flex column) mà không có
       min-height: 0 nên không co lại dưới cỡ nội dung được — mỗi dòng
       .item-row mới làm khung cao thêm, đẩy #stats-panel rồi cả
       #control-panel lên, ép màn Discord phía trên. Thêm min-height: 0
       là đủ vì chuỗi flex đã kín (stats-bottom flex:1 + min-height:0,
       stats-panel min-height:0 + overflow auto, control-panel max 44vh).
       Áp cho cả 2 body dùng class này (Vật Phẩm Rơi + Trận Gần Nhất). */
    .stats-section-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      font-size: 11px;
    }

    .last-battle-result {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .last-battle-result.win {
      color: #5ae05a;
    }

    .last-battle-result.loss {
      color: #e94560;
    }

    .last-battle-npc {
      color: #aaa;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .last-battle-rewards {
      color: #4ecca3;
      font-size: 11px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
      border-bottom: 1px solid #0f1a2e;
      font-size: 10px;
    }

    .item-name {
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-count {
      color: #c084fc;
      font-weight: 600;
      margin-left: 4px;
      white-space: nowrap;
    }

    /* === Log Panel === */
    #log-section {
      flex: 1 1 240px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* V37: khung log cố định như trước — panel cũ cao 240px thì log còn
       ~190px, log mới cuộn bên trong, không đẩy màn hình lên. Gốc lỗi:
       v35 bỏ chiều cao cố định của panel dưới, mà #log-area là flex item
       không có min-height: 0 nên không co lại dưới cỡ nội dung được —
       mỗi dòng log mới làm khung cao thêm, đẩy cả màn hình lên. */
    #log-area {
      flex: 1;
      min-height: 0;
      max-height: 200px;
      background: #0a0a1a;
      border: 1px solid #1a1a3e;
      border-radius: 4px;
      padding: 6px;
      font: 10px/1.4 monospace;
      color: #aaa;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    #log-area .log-entry {
      margin-bottom: 1px;
    }

    #log-controls {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    #log-controls button {
      background: #2a2a4a;
      color: #aaa;
      border: 1px solid #3a3a5a;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
    }

    #log-controls button:hover {
      background: #3a3a5a;
    }

    /* === Responsive: 22" / 16" / 15.6" / 14" ===
       Màn lớn giữ 3 cột như cũ. Màn hẹp: ô thống kê 6 -> 3 cột,
       panel dưới được cuộn và các cột tự xuống hàng thay vì bị cắt. */
    @media (max-width: 1400px) {
      .stats-top {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      #control-panel {
        max-height: 46vh;
      }
    }

    @media (max-width: 1100px) {
      #npc-panel,
      #stats-panel,
      #log-section {
        flex-basis: 100%;
        min-width: 0;
      }
      #log-section {
        min-height: 140px;
      }
      .stats-bottom {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .config-grid {
        grid-template-columns: 1fr;
      }
      #mode-tabs button {
        flex-basis: calc(50% - 4px);
      }
    }
  </style>
</head>

<body>
  <div id="bar">
    <h1>Discord NPC Auto</h1>
    <button id="btn-mute"
            title="Bật/Tắt tiếng toàn bộ âm thanh"
            onclick="toggleMute()">🔊</button>
  </div>

  <div id="content"></div>
  <div id="control-panel">
    <!-- NPC Panel (25%) -->
    <div id="npc-panel"
         class="panel-section">
      <div id="mode-tabs">
        <button id="tab-npc"
                class="active"
                onclick="setMode('npc')">⚔️ NPC</button>
        <button id="tab-luanhoi"
                onclick="setMode('luanhoi')">🌀 Luanhoi</button>
        <button id="tab-bicanh"
                onclick="setMode('bicanh')">⚔️ Bicanh</button>
        <button id="tab-dianguc"
                onclick="setMode('dianguc')">🔥 Dianguc</button>
        <button id="tab-upgrade"
                onclick="setMode('spam')">💀 Spam</button>
        <button id="tab-vandu"
                onclick="setMode('vandu')">🌿 Vandu</button>
        <button id="btn-config-modal"
                onclick="toggleSkillModal()"
                style="background:#2a2a4a;color:#eee;border:1px solid #3a3a5a;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;">⚙️</button>
      </div>
      <div id="skill-modal"
           style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:#1a1a2e;border:2px solid #e94560;border-radius:12px;padding:20px;width:90%;max-width:1100px;max-height:85vh;overflow-y:auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3 style="color:#e94560;margin:0;">⚔️ CẤU HÌNH SKILL BICANH</h3>
            <button onclick="toggleSkillModal()"
                    style="background:none;border:none;color:#eee;font-size:22px;cursor:pointer;">✕</button>
          </div>
          <p style="color:#aaa;font-size:11px;margin-bottom:10px;">Nhập STT cách nhau bởi dấu phẩy, ví dụ: <b style="color:#4ecca3;">3,4,5,9</b></p>
          <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-bottom:15px;">
            <div id="skill-grid-0"></div>
            <div id="skill-grid-1"></div>
            <div id="skill-grid-2"></div>
            <div id="skill-grid-3"></div>
          </div>
          <div style="margin-bottom:10px;">
            <label style="color:#eee;font-size:12px;">Combo có sẵn: </label>
            <select id="skill-combo-preset"
                    onchange="applySkillPreset(this.value)"
                    style="width:100%;padding:8px 10px;background:#0a0a1a;border:1px solid #1a1a4e;border-radius:6px;color:#eee;font-size:13px;outline:none;box-sizing:border-box;"></select>
          </div>
          <div style="margin-bottom:15px;">
            <label style="color:#eee;font-size:12px;">Thứ tự click: </label>
            <input id="skill-order-input"
                   type="text"
                   oninput="syncSkillPresetFromInput()"
                   placeholder="VD: 1,2,3,4,5,6"
                   style="width:100%;padding:8px 10px;background:#0a0a1a;border:1px solid #1a1a4e;border-radius:6px;color:#eee;font-size:14px;outline:none;box-sizing:border-box;">
          </div>
          <div style="margin-bottom:10px;">
            <label style="color:#eee;font-size:12px;">Delay giữa 2 lần click (ms) — dùng chung cho cả 4 mode: </label>
            <input id="skill-click-delay"
                   type="number"
                   value="1800"
                   min="100"
                   max="10000"
                   step="100"
                   style="width:100%;padding:8px 10px;background:#0a0a1a;border:1px solid #1a1a4e;border-radius:6px;color:#eee;font-size:14px;outline:none;box-sizing:border-box;">
          </div>
          <div style="margin-bottom:15px;">
            <label style="color:#eee;font-size:12px;">User ID Discord (dùng chung cho cả 6 mode): </label>
            <input id="userid-shared"
                   type="text"
                   placeholder="ID Discord (dãy số)"
                   style="width:100%;padding:8px 10px;background:#0a0a1a;border:1px solid #1a1a4e;border-radius:6px;color:#eee;font-size:14px;outline:none;box-sizing:border-box;">
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="saveSkillOrder()"
                    style="background:#1a5a2e;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;">💾 Lưu</button>
            <button onclick="resetSkillOrder()"
                    style="background:#5a1a1a;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;">Reset</button>
          </div>
          <div id="skill-order-status"
               style="margin-top:10px;color:#4ecca3;font-size:12px;"></div>
        </div>
      </div>
      <!-- === AUTO FARM NPC CONFIG === -->
      <div id="config-npc"
           class="mode-config active">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-npc-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="npc-number">NPC Number</label>
            <input id="npc-number"
                   type="number"
                   value="1"
                   min="1"
                   max="99">
          </div>
          <div class="config-field">
            <label for="cooldown-seconds">Cooldown (sec)</label>
            <input id="cooldown-seconds"
                   type="number"
                   value="80"
                   min="10"
                   max="600">
          </div>
          <div class="config-field">
            <label for="total-battles">Total Battles</label>
            <input id="total-battles"
                   type="number"
                   value="5"
                   min="1"
                   max="999">
          </div>
          <div class="config-field">
            <label style="color:#e94560;font-weight:600;font-size:9px;">AUTO CLIMB</label>

            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input id="auto-climb"
                     type="checkbox"
                     style="width:13px;height:13px;">
              <span style="font-size:10px;color:#ccc;">Bật</span>
            </label>
          </div>
          <div class="config-field">
            <label for="target-max-npc">Target NPC</label>
            <input id="target-max-npc"
                   type="number"
                   value="60"
                   min="1"
                   max="999">
          </div>
          <div class="config-field">
            <label style="color:#e94560;font-weight:600;font-size:9px;">TU LUYỆN</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input id="tu-luyen"
                     type="checkbox"
                     style="width:13px;height:13px;">
              <span style="font-size:10px;color:#ccc;">Sau mỗi trận</span>
            </label>
          </div>
        </div>
      </div>

      <!-- === LUÂN HỒI CONFIG === -->
      <div id="config-luanhoi"
           class="mode-config">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-luanhoi-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="luanhoi-target">Tầng Dừng (Target)</label>
            <!-- 1 input duy nhất: gõ số tự do, bấm mũi tên xuống để chọn
                 nhanh 1 mức preset trong datalist (50-300). Dùng type="text"
                 + inputmode="numeric" thay vì type="number" vì datalist không
                 hiện dropdown đáng tin cậy trên input number ở Chromium. -->
            <input id="luanhoi-target"
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   list="luanhoi-target-list"
                   value="50"
                   placeholder="Chọn hoặc tự nhập tầng...">
            <datalist id="luanhoi-target-list">
              <option value="50"></option>
              <option value="100"></option>
              <option value="150"></option>
              <option value="200"></option>
              <option value="220"></option>
              <option value="240"></option>
              <option value="260"></option>
              <option value="280"></option>
              <option value="300"></option>
            </datalist>
          </div>
          <div class="config-field">
            <label for="luanhoi-total-runs">Số lần đi</label>
            <input id="luanhoi-total-runs"
                   type="number"
                   value=""
                   min="0"
                   max="999"
                   placeholder="0">
          </div>
          <div class="config-field">
            <label for="luanhoi-cmd">Lệnh Tham Gia</label>
            <input id="luanhoi-cmd"
                   type="text"
                   value="!luanhoi">
          </div>
          <div class="config-field">
            <label for="button-delay-lh">Delay (sec)</label>
            <input id="button-delay-lh"
                   type="number"
                   value="3"
                   min="0.5"
                   max="10"
                   step="0.5">
          </div>
          <div class="config-field full">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input id="luanhoi-continue-noshard"
                     type="checkbox"
                     checked
                     style="width:13px;height:13px;">
              <span style="font-size:10px;color:#ccc;">Đi tiếp khi chưa thấy Mảnh (tới Target mà Mảnh set: 0 loại thì leo tiếp tới boss kế)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- === ĐỊA NGỤC CONFIG === -->
      <div id="config-dianguc"
           class="mode-config">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-dianguc-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="dianguc-cmd">Lệnh tham gia</label>
            <input id="dianguc-cmd"
                   type="text"
                   value="!dianguc">
          </div>
          <div class="config-field">
            <label for="dianguc-wait-buff">Wait buff (sec)</label>
            <input id="dianguc-wait-buff"
                   type="number"
                   value="15"
                   min="0"
                   max="120"
                   step="1">
          </div>
        </div>
      </div>

      <!-- === BICANH CONFIG === -->
      <div id="config-bicanh"
           class="mode-config">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-bicanh-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="bicanh-cmd">Lệnh</label>
            <input id="bicanh-cmd"
                   type="text"
                   value="!bicanh">
          </div>
        </div>
      </div>

      <!-- === VÂN DU CONFIG (v1, chưa có số lần đi) === -->
      <div id="config-vandu"
           class="mode-config">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-vandu-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="vandu-cmd">Lệnh Tham Gia</label>
            <input id="vandu-cmd"
                   type="text"
                   value="!vandu">
          </div>
          <div class="config-field">
            <label for="vandu-delay">Delay (sec)</label>
            <input id="vandu-delay"
                   type="number"
                   value="2"
                   min="0.5"
                   max="10"
                   step="0.5">
          </div>
          <div class="config-field">
            <label for="vandu-total-trips">Số lần đi</label>
            <input id="vandu-total-trips"
                   type="number"
                   value=""
                   min="0"
                   max="999"
                   placeholder="0">
          </div>
          <div class="config-field full">
            <label for="vandu-realm">Chọn Map theo Cảnh Giới</label>
            <select id="vandu-realm" style="width: 100%;">
              <option value="">— Chưa chọn (chọn tay trong game) —</option>
              <option value="Luyện Khí">Luyện Khí — Thanh Vân Trấn</option>
              <option value="Trúc Cơ">Trúc Cơ — Vạn Sơn Liên Mạch</option>
              <option value="Kết Đan">Kết Đan — Đông Hải Tiên Đảo</option>
              <option value="Nguyên Anh">Nguyên Anh — Tây Vực Sa Mạc</option>
              <option value="Hóa Thần">Hóa Thần — Thiên Sơn Tuyết Lãnh</option>
            </select>
          </div>
          <div class="config-field full">
            <label style="font-size:9px;color:#888;">Vân Du: chọn cảnh giới trong list trước khi START, bot sẽ mở danh sách map trong game, chọn map tương ứng rồi bấm Bắt Đầu Xuất Phát. Để trống = chọn tay trong game. Số lần đi: nhập N thì bot tự chạy đủ N chuyến (mỗi chuyến bấm xong Trở Về Giang Hồ tính 1 lần), để trống/0 thì 1 chuyến rồi dừng như cũ.</label>
          </div>
        </div>
      </div>

      <!-- === UPGRADE CONFIG === -->
      <!-- === SPAM CONFIG === -->
      <div id="config-upgrade"
           class="mode-config">
        <div class="config-grid">
          <div class="config-field full">
            <button id="btn-upgrade-toggle"
                    style="width: 100%;"
                    class="btn-start"
                    onclick="toggleBot()">▶ START</button>
          </div>
          <div class="config-field">
            <label for="spam-count">Số lần gửi</label>
            <input id="spam-count"
                   type="number"
                   value="10"
                   min="1"
                   max="9999">
          </div>
          <div class="config-field">
            <label for="upgrade-delay">Delay (sec)</label>
            <input id="upgrade-delay"
                   type="number"
                   value="2"
                   min="0.1"
                   max="60"
                   step="0.1">
          </div>
          <div class="config-field full">
            <label for="upgrade-type">Loại spam</label>
            <select id="upgrade-type"
                    style="width:100%;padding:3px 5px;background:#0a0a1a;border:1px solid #1a1a4e;border-radius:3px;color:#eee;font-size:11px;outline:none;">
              <option value="hp">/upgrade hp — ❤ HP</option>
              <option value="atk">/upgrade atk — ⚔ ATK</option>
              <option value="def">/upgrade def — 🛡 DEF</option>
              <option value="roll_x10">/roll_x10</option>
              <option value="waifu_roll">/waifu roll 10</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats Panel (50%) -->
    <div id="stats-panel"
         class="panel-section">
      <h3>📊 Thống Kê Trận Đấu</h3>
      <div class="stats-top">
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">🎯</span> Target</p>
          <span class="stat-box-value target"
                id="stat-total">0 trận</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">🏆</span> Chiến Thắng</p>
          <span class="stat-box-value win"
                id="stat-wins">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">✕</span> Thất Bại</p>
          <span class="stat-box-value loss"
                id="stat-losses">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">💰</span> Coins</p>
          <span class="stat-box-value coin"
                id="stat-coins">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">✨</span> XP</p>
          <span class="stat-box-value exp"
                id="stat-exp">0</span>
        </div>
        <div class="stat-box">
          <p class="stat-box-label"><span class="stat-box-icon">💎</span> Vật Phẩm</p>
          <span class="stat-box-value item"
                id="stat-items-count">0</span>
        </div>
      </div>
      <div class="stats-bottom">
        <div class="stats-section">
          <h4>Trận Gần Nhất</h4>
          <div class="stats-section-body"
               id="last-battle-info">
            <div style="color:#666;font-size:10px;">Chưa có trận nào...</div>
          </div>
        </div>
        <div class="stats-section">
          <h4>Vật Phẩm Rơi</h4>
          <div class="stats-section-body"
               id="items-list">
            <div style="color:#666;font-size:10px;">Chưa có vật phẩm...</div>
          </div>
          <button id="btn-reset-stats"
                  class="btn-secondary"
                  onclick="resetStats()"
                  style="margin-top:4px;width:100%;font-size:9px;padding:2px;">Reset Stats</button>
        </div>
      </div>
    </div>

    <!-- Log Panel (25%) -->
    <div id="log-section"
         class="panel-section">
      <h3>Logs</h3>
      <div id="log-area"></div>
      <div id="log-controls">
        <button onclick="loadLogs()">Refresh</button>
        <button onclick="clearLogs()">Clear</button>
        <button id="btn-copy-log"
                onclick="copyLogs()">📋 Copy Log</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
